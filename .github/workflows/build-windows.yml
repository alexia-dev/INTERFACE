name: Build NEXA Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-windows.txt

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Verificar sintaxe
        shell: pwsh
        run: |
          python -m py_compile main.py app.py build.py
          python -m py_compile core/*.py repositories/*.py screens/*.py

      - name: Rodar testes
        shell: pwsh
        run: |
          pip install pytest
          pytest -q

      - name: Gerar executável
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name NEXA --add-data "ui;ui" --collect-all kivy --collect-all kivymd main.py

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: nexa-windows
          path: dist/NEXA.exe
          if-no-files-found: error
          retention-days: 14
