name: Build NEXA Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Verificar sintaxe
        shell: pwsh
        run: |
          python -m py_compile main.py app.py build.py

      - name: Gerar executável
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name NEXA --add-data "ui;ui" --collect-all kivy --collect-all kivymd main.py

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: nexa-windows
          path: dist/NEXA.exe
          if-no-files-found: error
          retention-days: 14
