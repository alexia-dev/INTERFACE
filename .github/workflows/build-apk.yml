name: Build NEXA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython<3.1"

      - name: Preparar SDK Android usado pelo Buildozer
        shell: bash
        run: |
          set +e
          buildozer -v android debug
          BOOTSTRAP_EXIT=$?
          set -e

          export SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          echo "SDK_ROOT=$SDK_ROOT"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          else
            echo "sdkmanager não encontrado após o bootstrap do Buildozer."
            exit 1
          fi

          echo "Aceitando licenças Android..."
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          echo "Instalando componentes Android necessários..."
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed

          echo "Bootstrap terminou com código $BOOTSTRAP_EXIT; a compilação final será executada na próxima etapa."

      - name: Gerar APK de teste
        run: buildozer -v android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
