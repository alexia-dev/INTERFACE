name: Build NEXA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  BUILDOZER_WARN_ON_ROOT: "0"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             git             zip             unzip             autoconf             automake             libtool             libltdl-dev             pkg-config             zlib1g-dev             libncurses5-dev             libncursesw5-dev             cmake             libffi-dev             libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython<3.1"

      - name: Verificar projeto
        run: |
          test -f buildozer.spec
          test -f main.py
          test -f requirements-mobile.txt
          python -m py_compile main.py

      - name: Limpar ambiente Buildozer
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Aceitar licenças Android
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf '%s\n'             24333f8a63b6825ea9c5514f83c2829b004d1fee             84831b9409646a918e30573bab4c9c91346d8abd             d56f5187479451eabf01fb78af6dfcb131a6481e             > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Bootstrap SDK, NDK e python-for-android
        run: |
          buildozer android p4a -- --help

      - name: Gerar APK de teste
        run: |
          buildozer -v android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
