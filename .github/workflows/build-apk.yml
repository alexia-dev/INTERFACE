name: Build NEXA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython<3.1"

      - name: Verificar checkout e arquivos
        run: |
          pwd
          test -f buildozer.spec
          test -f main.py
          find . -maxdepth 2 -type f | sort

      - name: Preparar SDK Android usado pelo Buildozer
        shell: bash
        run: |
          set -e
          export SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          echo "SDK_ROOT=$SDK_ROOT"

          # Bootstrap somente o SDK sem deixar a tentativa de build matar o job.
          set +e
          buildozer android update
          UPDATE_EXIT=$?
          set -e
          echo "buildozer android update exit: $UPDATE_EXIT"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          else
            echo "sdkmanager não encontrado em $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -name sdkmanager -type f -print || true
            exit 1
          fi

          mkdir -p "$SDK_ROOT/licenses"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

          test -x "$SDK_ROOT/build-tools/35.0.0/aidl"
          "$SDK_ROOT/build-tools/35.0.0/aidl" --version || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list

      - name: Preparar dependências Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "cython<3.1"

      - name: Gerar APK de teste
        run: buildozer -v android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
