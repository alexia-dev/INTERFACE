name: Build NEXA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build NEXA APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Construir APK com imagem oficial do Buildozer
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -w /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
