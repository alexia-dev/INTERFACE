name: NEXA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Teste e validação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-mobile.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mobile.txt pytest
          pip install ruff

      - name: Verificar sintaxe
        run: python -m py_compile main.py app.py core/database.py repositories/appointments.py repositories/billing.py screens/*.py

      - name: Lint
        run: ruff check main.py app.py core repositories screens tests --ignore I001

      - name: Rodar testes
        run: pytest -q
